# The old distribution name, kept so `pip install WeatherUnits` and existing
# `import WeatherUnits` keep working. It depends on unitcorn and forwards every
# import to it. Publish it after unitcorn, from this directory.
[project]
name = "WeatherUnits"
version = "0.9.0"
description = "Renamed to unitcorn. This package forwards to it."
readme = "README.md"
license = "MIT"
authors = [{ name = "noblecloud", email = "git@noblecloud.io" }]
requires-python = ">=3.12,<3.15"
dependencies = ["unitcorn>=0.9.0,<0.10"]
classifiers = [
	"Development Status :: 7 - Inactive",
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/noblecloud/WeatherUnits"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
