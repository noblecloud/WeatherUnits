name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run tests
        run: poetry run pytest
      - name: Build unitcorn and the WeatherUnits shim
        run: |
          poetry build -o dist
          python -m pip wheel --no-deps -w dist ./compat/WeatherUnits
          python -m pip install dist/unitcorn-*.whl dist/weatherunits-*.whl
          cd /tmp && python -W "error:WeatherUnits has been renamed" -c "import unitcorn" && python -c "import WeatherUnits, unitcorn; assert WeatherUnits.Length is unitcorn.Length"
