name: Release

# Publishes unitcorn, then the WeatherUnits forwarding shim, to PyPI when a
# version tag is pushed (git tag v0.9.0 && git push origin v0.9.0).
# Uses PyPI trusted publishing: no token is stored in this repo. Each project
# needs a trusted publisher configured on PyPI (owner noblecloud, repo noblecloud/unitcorn,
# workflow release.yml, environment pypi). See docs/releasing.md.

on:
  push:
    tags: ["v*", "[0-9]*"]

jobs:
  unitcorn:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - run: poetry build -o dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  shim:
    needs: unitcorn
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip wheel --no-deps -w dist ./compat/WeatherUnits
      - run: python -m pip install build && python -m build --sdist -o dist ./compat/WeatherUnits
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
