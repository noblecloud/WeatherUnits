[Location]
timezone =
lat =
lon =


[LocalUnits]

# Mass Units:
# milligram (mg), gram (g), kilogram (kg), ounce (oz), pound (lbs)

# Length Units:
# miles (mi), inches (in), meters (m), kilometers (km)

# Time Units:
# millisecond (ms), second (s), minute (min), hour (hr), day (d)

# Multi-unit values are separated by '/'.  Example: wind = m/s

wind =                    # length / time
temperature =             # fahrenheit (f), celsius (c), kelvin (k)
precipitation =           # length
precipitationRate =       # length / time | * denotes to leave time the same as converting measurement or default to hour
pressure =                # bar, hPa, millibar (mb), inHg, mmHg
density =                 # mass / length

# 1) Any unit property can be defined by specifying key value pairs separated by a ','
# 2) Properties are specified without the leading '_'
# 3) Units are specified with their lowercase names or types
# 4) Empty values will be read as '' and denote being set
# 5) Values without an '=' will be read as None and denote being unset
#
#  precision:  The number of digits allowed to be displayed past the decimal
#              but will not exceed max
#			   Example number: 3.14159m
#              0: 3m		1: 3.1m		2: 3.14m	3: 3.141m
#
# 	 	 max:  The total number of digits that can be displayed while still showing
#		 	   the decimal.  If shorten is True, numbers would be reduced by factors
#              of 10^3
#              Example number: 415.25mm
#	           2: 0.4k mm	 3: 415mm	4: 415.3mm	5: 415.25mm
#
#        unit: Override built in unit string
#
#      suffix: Override built in suffix string.  Currently only used for shortening numbers
#
#   unit_symbol: Override built in unit_symbol.  Currently only used for ° with degrees
#
#       title: Title to be used by other display programs
#
#         exp: Override exponent.  I can't imagine why this would be used
#
#    show_unit: Show unit
#              True: 5km	False: 5
#
# leading_zero: Display zero before values less than 1
#              True: 0.1in	False: .1in		auto (default): decides per value
#              The zero costs a digit of `max`, and that digit is sometimes
#              the difference between showing a value and showing nothing.
#              `auto` drops it ONLY when keeping it would render the value
#              as zero AND dropping it actually rescues a digit:
#                0.5  digit_budget=2  -> 0.5   (already meaningful, keep)
#                0.01 digit_budget=2  -> .01   (keeping gives 0.0, drop rescues it)
#                0.01 digit_budget=3  -> 0.01  (fits with the zero, keep)
#              See docs/formatting.md - the rule is subtler than it looks
#              and two plausible simplifications of it are both wrong.
#
#trailing_zeros: Pad decimals to a stable width instead of the value's own
#              content.  By default `precision` is derived per value from how
#              many decimals that value actually has, so 29.92 shows '29.9'
#              but 30.0 shows '30' - a live readout changes width as it
#              crosses a whole number.  Set this where the value is glanced
#              at rather than read:
#                off        (default) the derived, variable width
#                precision  pad to the configured precision  -> 30.00
#                fill       pad to whatever the budget allows -> 30.000
#                <int>      exactly that many decimal places
#              Always capped by digit_budget, so padding can never push a
#              value over its budget.  True is an alias for 'precision'.
#
# unit_spacer:  Determines if there is a space between measurements and their units
#              True: 90° f    False: 90°f
#
# k_separator:  True: 1,000ft	 False: 1000ft
#
# shorten:	   Shortens values to fit within the max display amount
#			   True: 1k s	False: 1000s
#
# slide:	   Scale units for the appropriate values | Not yet implemented
#			   True: 1km		False: 1000m
#
# cardinal:	   Show degrees as cardinal direction | shorten decides full vs abbreviated name
#              True: 180°	False: S
#
# key: Key to be used for other programs
#
# size_hint:	   Override generated size hint string.  Useful for when you know the
#              expected max string length.
#

precision = 1
digit_budget = 3
unit =
suffix =
unit_symbol =
unit_spacer = True
title =
exp = 1
slide = False
show_unit = True
shorten = False
k_separator = None
key
size_hint
trailing_zeros = off

[UnitProperties]
# Any unit property can be defined by specifying key value pairs separated by a ','
Tiny = precision=3, digit_budget=4
Small = precision=2, digit_budget=4
Medium = precision=1, digit_budget=3
Large = precision=1, digit_budget=3
Huge = precision=2, digit_budget=3
mmHg = precision=2, digit_budget=5
voltage = precision=2, digit_budget=3, unit_spacer=False
temperature = precision=1, digit_budget=3, unit_spacer=False, shorten=False, k_separator=True
direction = cardinal=True, degrees=False
strikes = precision=2, digit_budget=5