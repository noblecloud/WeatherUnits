[tool.poetry]
name = "unitcorn"
version = "0.9.0"
description = "Units that convert, localize and format themselves, with weather-flavoured defaults"
authors = ["noblecloud <git@noblecloud.io>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/noblecloud/WeatherUnits"
keywords = ["units", "conversion", "converter", "localization", "formatting", "weather", "temperature"]
classifiers = [
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Natural Language :: English",
	"Development Status :: 4 - Beta",
	"Topic :: Utilities",
	"Topic :: Scientific/Engineering :: Atmospheric Science",
	"Topic :: Scientific/Engineering :: Physics",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Topic :: Software Development :: Libraries",
	"Intended Audience :: Developers",
	"Intended Audience :: Science/Research",
	"Intended Audience :: Education",
]
include = ["*.ini"]
packages = [
	{ include = "unitcorn", from = "src" }
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/noblecloud/WeatherUnits/issues"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"